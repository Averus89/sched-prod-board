# Deploys app/ to GitHub Pages and stamps the build sha (R6) into the page.
name: pages
on:
  push:
    branches: [main]
    paths: ['app/**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp build sha
        run: |
          mkdir -p _site && cp -r app/. _site/
          sed -i "s/__BUILD_SHA__/${GITHUB_SHA}/g" _site/index.html
          if [ -d media ]; then cp -r media _site/media; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
